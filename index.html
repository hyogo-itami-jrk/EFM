<script>

/* =========================
   半角数字だけにする
========================= */

function numberOnly(input) {
    input.value = input.value
        .replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
        .replace(/[^0-9]/g, '');
}

/* =========================
   数値を取得
========================= */

function getNumber(id) {

    const value = document.getElementById(id).value;

    if (value === '') {
        return 0;
    }

    return Number(value);
}


/* =========================
   「うち初」の人数制限
========================= */

function updateFirstLimit(participantId, firstId) {

    const participant = getNumber(participantId);
    const firstInput = document.getElementById(firstId);

    /*
       参加者数を超えていた場合、
       参加者数まで自動的に下げる
    */

    if (firstInput.value !== '') {

        const first = Number(firstInput.value);

        if (first > participant) {
            firstInput.value = participant;
        }
    }
}


/* =========================
   「うち初」を入力したときのチェック
========================= */

function validateFirst(input) {

    const participantId = input.dataset.participant;

    const participant = getNumber(participantId);

    if (input.value === '') {
        return;
    }

    const first = Number(input.value);

    if (first > participant) {
        input.value = participant;

        showMessage(
            '「うち初」の人数は「参加者」の人数を超えることはできません。',
            true
        );
    }
}


/* =========================
   メッセージ表示
========================= */

function showMessage(text, error = false) {

    const message = document.getElementById('message');

    message.textContent = text;

    if (error) {
        message.className = 'message error';
    } else {
        message.className = 'message';
    }
}


/* =========================
   合計計算
========================= */

function calculate() {

    /*
        10代
        男性：1、2
        女性：3、4
    */

    const A = getNumber('input1') + getNumber('input3');
    const a = getNumber('input2') + getNumber('input4');


    /*
        20代
    */

    const B = getNumber('input5') + getNumber('input7');
    const b = getNumber('input6') + getNumber('input8');


    /*
        30代
    */

    const C = getNumber('input9') + getNumber('input11');
    const c = getNumber('input10') + getNumber('input12');


    /*
        40代
    */

    const D = getNumber('input13') + getNumber('input15');
    const d = getNumber('input14') + getNumber('input16');


    /*
        50代
    */

    const E = getNumber('input17') + getNumber('input19');
    const e = getNumber('input18') + getNumber('input20');


    /*
        60代
    */

    const F = getNumber('input21') + getNumber('input23');
    const f = getNumber('input22') + getNumber('input24');


    /*
        70代
    */

    const G = getNumber('input25') + getNumber('input27');
    const g = getNumber('input26') + getNumber('input28');


    /*
        80代
    */

    const H = getNumber('input29') + getNumber('input31');
    const h = getNumber('input30') + getNumber('input32');


    /* 年代別合計を表示 */

    document.getElementById('totalA').textContent = A;
    document.getElementById('totala').textContent = a;

    document.getElementById('totalB').textContent = B;
    document.getElementById('totalb').textContent = b;

    document.getElementById('totalC').textContent = C;
    document.getElementById('totalc').textContent = c;

    document.getElementById('totalD').textContent = D;
    document.getElementById('totald').textContent = d;

    document.getElementById('totalE').textContent = E;
    document.getElementById('totale').textContent = e;

    document.getElementById('totalF').textContent = F;
    document.getElementById('totalf').textContent = f;

    document.getElementById('totalG').textContent = G;
    document.getElementById('totalg').textContent = g;

    document.getElementById('totalH').textContent = H;
    document.getElementById('totalh').textContent = h;


    /* 男性合計 */

    const maleTotal =
        getNumber('input1') +
        getNumber('input5') +
        getNumber('input9') +
        getNumber('input13') +
        getNumber('input17') +
        getNumber('input21') +
        getNumber('input25') +
        getNumber('input29');


    /* 男性初参加合計 */

    const maleFirstTotal =
        getNumber('input2') +
        getNumber('input6') +
        getNumber('input10') +
        getNumber('input14') +
        getNumber('input18') +
        getNumber('input22') +
        getNumber('input26') +
        getNumber('input30');


    /* 女性合計 */

    const femaleTotal =
        getNumber('input3') +
        getNumber('input7') +
        getNumber('input11') +
        getNumber('input15') +
        getNumber('input19') +
        getNumber('input23') +
        getNumber('input27') +
        getNumber('input31');


    /* 女性初参加合計 */

    const femaleFirstTotal =
        getNumber('input4') +
        getNumber('input8') +
        getNumber('input12') +
        getNumber('input16') +
        getNumber('input20') +
        getNumber('input24') +
        getNumber('input28') +
        getNumber('input32');


    /* 全体 */

    const grandTotal = maleTotal + femaleTotal;

    const grandFirstTotal =
        maleFirstTotal + femaleFirstTotal;


    /* 表示 */

    document.getElementById('maleTotal').textContent = maleTotal;
    document.getElementById('maleFirstTotal').textContent = maleFirstTotal;

    document.getElementById('femaleTotal').textContent = femaleTotal;
    document.getElementById('femaleFirstTotal').textContent = femaleFirstTotal;

    document.getElementById('grandTotal').textContent = grandTotal;
    document.getElementById('grandFirstTotal').textContent = grandFirstTotal;
}

/* =========================
   Googleスプレッドシートへ送信
========================= */

const SCRIPT_URL =
    'https://script.google.com/macros/s/AKfycbxrPFWo2B5SspvUHPZL3sHAfOYtQZartewYe5RWgM2UmRlipmKL_F0BWahlS22MW01i/exec';


async function sendData() {

    const loungeName =
        document.getElementById('input0').value.trim();

    /* ラウンジ名は必須 */

    if (loungeName === '') {

        showMessage(
            'ラウンジ名を入力してください。',
            true
        );

        document.getElementById('input0').focus();

        return;
    }


    /* 「うち初」≦「参加者」を確認 */

    const pairs = [
        ['input1', 'input2'],
        ['input3', 'input4'],
        ['input5', 'input6'],
        ['input7', 'input8'],
        ['input9', 'input10'],
        ['input11', 'input12'],
        ['input13', 'input14'],
        ['input15', 'input16'],
        ['input17', 'input18'],
        ['input19', 'input20'],
        ['input21', 'input22'],
        ['input23', 'input24'],
        ['input25', 'input26'],
        ['input27', 'input28'],
        ['input29', 'input30'],
        ['input31', 'input32']
    ];


    for (const pair of pairs) {

        const participant = getNumber(pair[0]);
        const first = getNumber(pair[1]);

        if (first > participant) {

            showMessage(
                '「うち初」の人数が「参加者」の人数を超えています。',
                true
            );

            document.getElementById(pair[1]).focus();

            return;
        }
    }


    /* ボタンを一時的に無効にする */

    const button =
        document.querySelector('.button-area button');

    button.disabled = true;
    button.textContent = '送信中…';


    /*
       Googleスプレッドシートへ送るデータ
       
       空欄の人数は「0」として保存します。
    */

    const data = new URLSearchParams();

    /* 入力0：ラウンジ名 */

    data.append(
        'input0',
        loungeName
    );


    /* 入力1～32：人数 */

    for (let i = 1; i <= 32; i++) {

        data.append(
            'input' + i,
            getNumber('input' + i)
        );
    }


    /* 入力33：未会友参加者数 */

    data.append(
        'input33',
        getNumber('input33')
    );

    try {

        const response = await fetch(
            SCRIPT_URL,
            {
                method: 'POST',
                body: data
            }
        );

        const result = await response.json();

        if (!result.ok) {
            throw new Error(result.error || '保存に失敗しました');
        }

        showMessage(
            '送信しました。ありがとうございます。' +
            '修正がある場合は、内容を直してもう一度送信してください（上書きされます）。'
        );

        button.disabled = false;
        button.textContent = '送信する';

        // resetForm();

    } catch (error) {

        console.error(error);

        showMessage(
            '送信できませんでした。通信状態を確認してください。',
            true
        );

        button.disabled = false;
        button.textContent = '送信する';
    }
}


/* =========================
   フォームを空にする
========================= */

function resetForm() {

    document.getElementById('input0').value = '';
    document.getElementById('input33').value = '';

    for (let i = 1; i <= 32; i++) {

        document.getElementById(
            'input' + i
        ).value = '';
    }

    calculate();
}



/* 初期表示 */

calculate();

</script>
